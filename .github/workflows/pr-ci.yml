name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["*"]

# Cancel previous runs for the same PR / branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Install dependencies ────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm ci
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: npm audit (supply chain)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: "npm audit --audit-level=high || echo 'WARN: npm audit found high/critical vulnerabilities'"

  # ── 3. Pack validation ─────────────────────────────────────
  pack:
    name: Pack
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies on cache miss
        run: test -x node_modules/.bin/tsdown || npm ci --ignore-scripts

      - name: npm pack (dry-run)
        run: npm pack --dry-run

      - name: npm pack
        run: npm pack

      - name: Upload .tgz artifact
        uses: actions/upload-artifact@v5
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 7

  # ── 5. Plugin manifest validation ──────────────────────────
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate openclaw.plugin.json
        run: |
          echo "── Checking openclaw.plugin.json exists ──"
          test -f openclaw.plugin.json || { echo "❌ openclaw.plugin.json not found"; exit 1; }

          echo "── Checking valid JSON ──"
          node -e "JSON.parse(require('fs').readFileSync('openclaw.plugin.json','utf8'))" || { echo "❌ Invalid JSON"; exit 1; }

          echo "── Checking required fields ──"
          node -e "
            const m = JSON.parse(require('fs').readFileSync('openclaw.plugin.json','utf8'));
            const errors = [];
            if (!m.id || typeof m.id !== 'string') errors.push('missing or invalid \"id\"');
            if (m.configSchema && typeof m.configSchema !== 'object') errors.push('\"configSchema\" must be an object');
            if (errors.length) { console.error('❌ Manifest errors:', errors.join(', ')); process.exit(1); }
            console.log('✅ id:', m.id);
            if (m.name) console.log('   name:', m.name);
            if (m.configSchema) console.log('   configSchema: present (' + Object.keys(m.configSchema.properties || {}).length + ' top-level props)');
          "

          echo "── Checking package.json openclaw metadata ──"
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            const oc = pkg.openclaw || {};
            const errors = [];
            if (!oc.extensions || !oc.extensions.length) errors.push('missing openclaw.extensions');
            if (!oc.compat?.pluginApi) errors.push('missing openclaw.compat.pluginApi');
            if (!oc.build?.openclawVersion) errors.push('missing openclaw.build.openclawVersion');
            if (errors.length) { console.error('❌ Package metadata errors:', errors.join(', ')); process.exit(1); }
            console.log('✅ openclaw metadata OK');
            console.log('   pluginApi:', oc.compat.pluginApi);
            console.log('   openclawVersion:', oc.build.openclawVersion);
          "

  # ── 6. Package size guard ──────────────────────────────────
  size:
    name: Size Guard
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v5
        with:
          name: package-tarball

      - name: Check package size
        run: |
          TGZ=$(ls *.tgz | head -1)
          SIZE=$(stat -c%s "$TGZ" 2>/dev/null || stat -f%z "$TGZ")
          SIZE_KB=$((SIZE / 1024))
          MAX_KB=5120

          echo "📦 Package: $TGZ"
          echo "   Size: ${SIZE_KB} KB (limit: ${MAX_KB} KB)"

          if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
            echo "❌ Package exceeds ${MAX_KB} KB size limit!"
            echo "   Consider checking if large files were accidentally included."
            exit 1
          else
            echo "✅ Size OK"
          fi

  # ── 7. TypeScript adapter tests ─────────────────────────────
  test-ts:
    name: Test TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm ci
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Run MemoryAdapter tests
        run: npx vitest run src/core/memory-adapter.test.ts --reporter=verbose

      - name: Run TdaiHttpClient unit tests
        run: npx vitest run src/core/tdai-http-client.test.ts --reporter=verbose

      - name: Run Gate tests (R1+R2)
        run: npx vitest run src/core/gates/gate-rate-limit.test.ts src/core/gates/gate-circuit-breaker.test.ts src/core/gates/gate-audit.test.ts src/core/gates/gate-redteam.test.ts --reporter=verbose

      - name: Run SDK tests (v1.0.0 base)
        working-directory: sdk/typescript
        run: npx vitest run --reporter=verbose

      - name: Run Utils tests (v1.0.0 base)
        run: npx vitest run src/utils/no-think-fetch.test.ts src/utils/sanitize.test.ts src/utils/time.test.ts --reporter=verbose

  # ── 8. Python bridge_adapter smoke test ─────────────────────
  test-py:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bridge_adapter
        run: pip install ./bridge_adapter

      - name: Import smoke test
        run: |
          python -c "
          from bridge_adapter import BridgeAdapter, TdaiAdapterRegistry
          from bridge_adapter.base import TdaiAdapter
          from bridge_adapter.integrity import verify_manifest
          print(f'Import OK — bridge_adapter registered adapters: {TdaiAdapterRegistry.list()}')
          violations = verify_manifest()
          if violations:
            print(f'SHA256 integrity: {len(violations)} violation(s)')
            for v in violations:
              print(f'  ✗ {v}')
            exit(1)
          else:
            print('SHA256 integrity: OK')
          "

  # ── 9. Encoding Defense (Layer 5: non-ASCII scan + Layer 1: BOM check) ──
  encoding-defense:
    name: Encoding Defense (L1+L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: L5 - Detect garbled Unicode in .py/.ts files
        run: |
          echo "── Layer 5: non-ASCII scan in .py and .ts files ──"
          violations=0; fails=0
          while IFS= read -r -d '' f; do
            if grep -Pl '[^\x00-\x7F\x0A\x0D\x09]' "$f" 2>/dev/null | grep -q .; then
              chars=$(grep -oP '[^\x00-\x7F\x0A\x0D\x09]' "$f" 2>/dev/null | sort -u | head -5 | tr '\n' ' ')
              fails=$((fails + 1))
              echo "  BAD: $f ($chars)"
            fi
          done < <(find . \( \
            -path './bridge/*.py' -o \
            -path './bridge/*.ts' -o \
            -path './bridge_adapter/*.py' -o \
            -path './bridge_adapter/*.ts' -o \
            -path './docs/*.py' -o \
            -path './docs/*.ts' \
          \) | tr '\n' '\0')
          if [ "$fails" -gt 0 ]; then echo "FAIL: $fails files with non-ASCII chars"; exit 1; fi
          echo "OK: $fails files with non-ASCII (0 = clean)"

      - name: L1 - Verify UTF-8 BOM on scripts/*.ps1
        run: |
          echo "── Layer 1: UTF-8 BOM check on scripts/*.ps1 ──"
          fails=0
          for f in scripts/*.ps1; do
            if [ ! -f "$f" ]; then continue; fi
            header=$(od -A n -t x1 -N 3 "$f" | tr -d ' \n')
            if [ "$header" != "efbbbf" ]; then
              echo "  MISSING BOM: $f (header=$header)"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then echo "FAIL: $fails scripts/*.ps1 without BOM"; exit 1; fi
          echo "OK: all scripts/*.ps1 have UTF-8 BOM"

  # ── 10. File corruption guard ─────────────────────────────
  file-integrity:
    name: File Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax and UTF-8 validity
        run: |
          FAILS=0
          while IFS= read -r -d '' f; do
            # UTF-8 validity
            if ! python3 -c "open('$f','rb').read().decode('utf-8')" 2>/dev/null; then
              echo "  INVALID UTF-8: $f"
              FAILS=$((FAILS + 1))
              continue
            fi
            # Python syntax
            if [[ "$f" == *.py ]]; then
              if ! python3 -c "import ast; ast.parse(open('$f', encoding='utf-8').read())" 2>/dev/null; then
                echo "  SYNTAX ERROR: $f"
                FAILS=$((FAILS + 1))
              fi
            fi
          done < <(find bridge bridge_adapter scripts src \
            -name '*.py' -o -name '*.ts' | tr '\n' '\0')
          if [ "$FAILS" -gt 0 ]; then echo "FAIL: $FAILS files corrupted"; exit 1; fi
          echo "OK: all files pass UTF-8 + Python syntax"

      - name: Check TypeScript compilation
        run: |
          if [ -f tsconfig.json ]; then
            echo "── Running tsc --noEmit ──"
            npm ci --ignore-scripts 2>/dev/null
            npx tsc --noEmit 2>&1 || { echo "FAIL: TypeScript compilation errors"; exit 1; }
            echo "OK: tsc --noEmit clean"
          else
            echo "SKIP: no tsconfig.json"
          fi

      - name: Check for truncated files (empty or no trailing newline)
        run: |
          FAILS=0
          while IFS= read -r -d '' f; do
            # Skip empty __init__.py (standard Python package marker)
            if [[ "$f" == */__init__.py ]]; then continue; fi
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -eq 0 ]; then
              echo "  EMPTY: $f"
              FAILS=$((FAILS + 1))
            elif [ "$SIZE" -lt 10 ]; then
              echo "  SUSPICIOUS (tiny): $f ($SIZE bytes)"
              FAILS=$((FAILS + 1))
            fi
          done < <(find bridge bridge_adapter scripts src \
            -name '*.py' -o -name '*.ts' | tr '\n' '\0')
          if [ "$FAILS" -gt 0 ]; then echo "FAIL: $FAILS truncated/tiny files"; exit 1; fi
          echo "OK: all files non-empty"

  # ── 11. OTLP pipeline verification (cross-platform) ─────────
  otlp-verify:
    name: OTLP Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm ci
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      # ── Linux: Docker ──
      - name: Start Jaeger via Docker (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name jaeger \
            -e COLLECTOR_OTLP_HTTP_HOST_PORT=:4318 \
            -p 4318:4318 -p 16686:16686 \
            jaegertracing/all-in-one:latest
          echo "Waiting for Jaeger container..."
          sleep 5

      # ── macOS: binary download (v2.19.0, arm64) ──
      - name: Download & start Jaeger (macOS)
        if: runner.os == 'macOS'
        run: |
          JAEGER_VERSION="2.19.0"
          curl -sLO "https://github.com/jaegertracing/jaeger/releases/download/v${JAEGER_VERSION}/jaeger-${JAEGER_VERSION}-darwin-arm64.tar.gz"
          tar xzf "jaeger-${JAEGER_VERSION}-darwin-arm64.tar.gz"
          BINARY="./jaeger-${JAEGER_VERSION}-darwin-arm64/jaeger"
          chmod +x "$BINARY"
          "$BINARY" > /tmp/jaeger.log 2>&1 &
          echo $! > /tmp/jaeger.pid
          echo "Jaeger PID: $(cat /tmp/jaeger.pid)"
          sleep 5
          if kill -0 $(cat /tmp/jaeger.pid) 2>/dev/null; then
            echo "Jaeger process is running"
          else
            echo "Jaeger process died. Log:"
            cat /tmp/jaeger.log 2>/dev/null || echo "(no log)"
            exit 1
          fi

      # ── Windows: binary with debug logging ──
      - name: Download & start Jaeger (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $JAEGER_VERSION = "2.19.0"
          $URL = "https://github.com/jaegertracing/jaeger/releases/download/v${JAEGER_VERSION}/jaeger-${JAEGER_VERSION}-windows-amd64.zip"
          Invoke-WebRequest -Uri $URL -OutFile "jaeger.zip"
          Expand-Archive -Path "jaeger.zip" -DestinationPath "." -Force
          # Show extracted files
          Get-ChildItem -Path ".\jaeger-${JAEGER_VERSION}-windows-amd64" -Recurse | Select-Object Name, Length | Write-Output
          $bin = ".\jaeger-${JAEGER_VERSION}-windows-amd64\jaeger.exe"
          if (-not (Test-Path $bin)) {
            $bin = ".\jaeger-2.19.0-windows-amd64\jaeger.exe"
          }
          Write-Output "Starting: $bin"
          $log = ".\jaeger-stdout.log"
          $err = ".\jaeger-stderr.log"
          # Capture stderr so we can debug failures
          $p = Start-Process -FilePath $bin -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Output "Jaeger exited with code $($p.ExitCode)"
            if (Test-Path $log) { Write-Output "=== stdout ===" ; Get-Content $log }
            if (Test-Path $err) { Write-Output "=== stderr ===" ; Get-Content $err }
            exit 1
          }
          Write-Output "Jaeger running (PID: $($p.Id))"
          # Check what ports it's listening on
          netstat -ano | Select-String "4318" | Write-Output

      # ── Wait for readiness ──
      - name: Wait for Jaeger readiness (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for i in $(seq 1 15); do
            if curl -s http://localhost:16686/api/services > /dev/null 2>&1; then
              echo "Jaeger ready"
              exit 0
            fi
            echo "Waiting for Jaeger... ($i/15)"
            sleep 2
          done
          echo "Jaeger did not start"
          exit 1

      - name: Wait for Jaeger readiness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $retries = 15
          for ($i = 1; $i -le $retries; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://localhost:16686/api/services" -UseBasicParsing
              Write-Output "Jaeger ready"
              exit 0
            } catch {
              Write-Output "Waiting for Jaeger... ($i/$retries)"
              Start-Sleep -Seconds 2
            }
          }
          Write-Output "Jaeger did not start"
          exit 1

      # ── Run verification ──
      - name: Run OTLP verify script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          TDAI_OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
          npx tsx scripts/otlp-verify.ts

      - name: Run OTLP verify script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TDAI_OTEL_ENABLED = "true"
          $env:OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"
          npx tsx scripts/otlp-verify.ts

      # ── Verify ──
      - name: Verify trace received by Jaeger (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          sleep 2
          if curl -s "http://localhost:16686/api/traces?service=bridge-mcp&lookback=5m" > /tmp/jaeger-response.json 2>/dev/null; then
            TRACES=$(python3 -c "import sys,json; d=json.load(open('/tmp/jaeger-response.json')); print(len(d.get('data', [])))" 2>/dev/null || echo "0")
            if [ "$TRACES" -gt 0 ]; then
              echo "✅ Jaeger received $TRACES trace(s)"
            else
              echo "⚠️  No traces found in Jaeger (may be delayed)"
            fi
          else
            echo "⚠️  Jaeger API not reachable (non-fatal)"
          fi

      - name: Verify trace received by Jaeger (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          try {
            $r = Invoke-RestMethod -Uri "http://localhost:16686/api/traces?service=bridge-mcp&lookback=5m" -UseBasicParsing
            $count = ($r.data | Measure-Object).Count
            if ($count -gt 0) {
              Write-Output "✅ Jaeger received $count trace(s)"
            } else {
              Write-Output "⚠️  No traces found in Jaeger (may be delayed)"
            }
          } catch {
            Write-Output "⚠️  Jaeger API not reachable (non-fatal)"
          }

      # ── Cleanup ──
      - name: Cleanup Jaeger (Linux)
        if: runner.os == 'Linux'
        run: docker rm -f jaeger 2>/dev/null || true

      - name: Cleanup Jaeger (macOS)
        if: runner.os == 'macOS'
        run: pkill -F /tmp/jaeger.pid 2>/dev/null || true

      - name: Cleanup Jaeger (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Process -Name "jaeger" -ErrorAction SilentlyContinue | Stop-Process -Force
